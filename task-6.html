<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ФОРМА РЕГИСТРАЦИИ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p><a class="text-p" href="./index.html">Go back</a></p>
    <h4>ФОРМА РЕГИСТРАЦИИ</h4>
    <form id="registerForm">
      <div class="form-group">
        <label for="firstName"></label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          class="form-input"
          placeholder="Имя"
        />
      </div>
      <div class="form-group">
        <label for="lastName"></label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          class="form-input"
          placeholder="Фамилия"
        />
      </div>
      <div class="form-group">
        <label for="email"></label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="email"
        />
      </div>
      <div class="form-group">
        <label for="phone"></label>
        <input
          type="tel"
          id="phone"
          name="phone"
          class="form-input"
          placeholder="+380..."
        />
      </div>
      <button class="btnForm" type="submit">Отправить</button>
    </form>

    <script src="./js/task-6.js"></script>
  </body>
</html>
